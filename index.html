<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>WaytoAGI 知识库导航</title>
<style>
  :root {
    --bg: #fbfbfd;
    --panel: #ffffff;
    --text: #1d1d1f;
    --text-dim: #6e6e73;
    --line: #e3e3e6;
    --hover: #f2f2f5;
    --accent: #2f6feb;
    --accent-soft: #eaf1fe;
    --shadow: 0 1px 3px rgba(0,0,0,.06);
  }
  [data-theme="dark"] {
    --bg: #16161a;
    --panel: #1e1e23;
    --text: #e8e8ea;
    --text-dim: #9a9aa2;
    --line: #2e2e35;
    --hover: #27272e;
    --accent: #5b8def;
    --accent-soft: #1f2a3f;
    --shadow: 0 1px 3px rgba(0,0,0,.4);
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    background: var(--bg);
    color: var(--text);
    font: 15px/1.6 -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC",
          "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  .wrap { max-width: 1080px; margin: 0 auto; padding: 32px 20px 80px; }

  header { margin-bottom: 22px; }
  .title-row { display: flex; align-items: baseline; gap: 12px; flex-wrap: wrap; }
  h1 { font-size: 24px; margin: 0; letter-spacing: -.2px; }
  .meta { color: var(--text-dim); font-size: 13px; }
  .sub { color: var(--text-dim); font-size: 14px; margin: 8px 0 0; }

  .toolbar {
    display: flex; gap: 10px; align-items: center;
    margin: 18px 0 12px; flex-wrap: wrap;
  }
  .search {
    flex: 1 1 280px; position: relative;
  }
  .search input {
    width: 100%; padding: 10px 36px 10px 14px;
    font-size: 15px; font-family: inherit;
    color: var(--text); background: var(--panel);
    border: 1px solid var(--line); border-radius: 9px;
    outline: none; transition: border-color .15s, box-shadow .15s;
  }
  .search input:focus {
    border-color: var(--accent);
    box-shadow: 0 0 0 3px var(--accent-soft);
  }
  .search .clear {
    position: absolute; right: 8px; top: 50%; transform: translateY(-50%);
    border: 0; background: transparent; color: var(--text-dim);
    font-size: 18px; cursor: pointer; padding: 2px 6px; border-radius: 5px;
    display: none; line-height: 1;
  }
  .search .clear:hover { background: var(--hover); color: var(--text); }
  .search.has-value .clear { display: block; }

  button.btn {
    padding: 9px 13px; font-size: 14px; font-family: inherit;
    color: var(--text); background: var(--panel);
    border: 1px solid var(--line); border-radius: 9px;
    cursor: pointer; white-space: nowrap; transition: background .15s;
  }
  button.btn:hover { background: var(--hover); }

  .panel {
    background: var(--panel); border: 1px solid var(--line);
    border-radius: 12px; box-shadow: var(--shadow); overflow: hidden;
  }

  /* 树 */
  .row {
    display: flex; align-items: center; gap: 6px;
    padding: 7px 12px 7px 0; border-bottom: 1px solid var(--line);
    cursor: pointer; position: relative;
  }
  .row:last-child { border-bottom: 0; }
  .row:hover { background: var(--hover); }
  .twist {
    flex: 0 0 20px; text-align: center; color: var(--text-dim);
    font-size: 10px; transition: transform .12s; user-select: none;
  }
  .twist.open { transform: rotate(90deg); }
  .twist.leaf { visibility: hidden; }
  .ico { flex: 0 0 auto; font-size: 13px; opacity: .85; }
  .label {
    flex: 1 1 auto; min-width: 0; overflow: hidden;
    text-overflow: ellipsis; white-space: nowrap;
  }
  .row.leaf-row .label:hover { color: var(--accent); }
  .go {
    flex: 0 0 auto; color: var(--text-dim); text-decoration: none;
    font-size: 13px; padding: 2px 7px; border-radius: 6px; opacity: 0;
    transition: opacity .12s, background .12s;
  }
  .row:hover .go { opacity: 1; }
  .go:hover { background: var(--accent-soft); color: var(--accent); }
  .kids { display: none; margin-left: 22px; border-left: 1px solid var(--line); }
  .kids.open { display: block; }
  .path { color: var(--text-dim); font-size: 12px; margin-left: 8px; }

  mark { background: #ffe58f; color: inherit; border-radius: 2px; padding: 0 1px; }
  [data-theme="dark"] mark { background: #6b5416; }

  .empty { padding: 28px; text-align: center; color: var(--text-dim); font-size: 14px; }
  .more { padding: 10px 16px; color: var(--text-dim); font-size: 13px; border-top: 1px solid var(--line); }
  footer { margin-top: 22px; color: var(--text-dim); font-size: 13px; text-align: center; }
  footer a { color: var(--text-dim); }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="title-row">
      <h1>WaytoAGI 知识库导航</h1>
      <span class="meta" id="stat"></span>
    </div>
    <p class="sub">点击条目标题即可展开子目录；点击右侧 ↗ 在飞书中打开原文。</p>
  </header>

  <div class="toolbar">
    <div class="search" id="searchWrap">
      <input id="q" type="search" placeholder="搜索标题…（支持全库 14552 个节点）" autocomplete="off">
      <button class="clear" id="clear" title="清空">×</button>
    </div>
    <button class="btn" id="collapse">收起全部</button>
    <button class="btn" id="theme" title="切换主题">◐</button>
  </div>

  <div class="panel" id="panel"></div>

  <footer>
    数据来源：<a href="https://waytoagi.feishu.cn/wiki/DOYPwcGHAiluiekAeGgc3kM8nNb" target="_blank" rel="noopener">WaytoAGI 知识库</a>
    · 内容版权归原作者所有 · 本站仅作目录导航
  </footer>
</div>

<script src="data.js"></script>
<script>
(function () {
  var D = window.WIKI_DATA;
  var N = D.nodes;                 // [token, title, type, parentIdx, hasChild]
  var BASE = D.base;
  var TYPES = D.types;
  var ICON = { docx: '📄', sheet: '📊', bitable: '🗂', file: '📎', slides: '🖥', mindnote: '🧠' };
  var MAX_HITS = 300;

  var panel = document.getElementById('panel');
  var qEl = document.getElementById('q');
  var statEl = document.getElementById('stat');
  var searchWrap = document.getElementById('searchWrap');
  var openSet = Object.create(null);   // 已展开的节点下标

  // 预建 children 索引
  var children = Object.create(null);
  for (var i = 0; i < N.length; i++) {
    var p = N[i][3];
    (children[p] || (children[p] = [])).push(i);
  }
  var roots = children[-1] || [];
  statEl.textContent = '共 ' + N.length.toLocaleString() + ' 个节点 · ' + roots.length + ' 个一级目录';

  function linkOf(i) { return BASE + N[i][0]; }

  function esc(s) {
    return s.replace(/[&<>"]/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c];
    });
  }

  // 高亮关键词
  function hl(text, kw) {
    if (!kw) return esc(text);
    var lo = text.toLowerCase(), k = kw.toLowerCase(), out = '', from = 0, at;
    while ((at = lo.indexOf(k, from)) !== -1) {
      out += esc(text.slice(from, at)) + '<mark>' + esc(text.slice(at, at + k.length)) + '</mark>';
      from = at + k.length;
    }
    return out + esc(text.slice(from));
  }

  function makeRow(i, kw) {
    var node = N[i];
    var hasChild = node[4] === 1 && children[i];
    var row = document.createElement('div');
    row.className = 'row' + (hasChild ? '' : ' leaf-row');

    var tw = document.createElement('span');
    tw.className = 'twist' + (hasChild ? '' : ' leaf');
    tw.textContent = '▶';
    row.appendChild(tw);

    var ico = document.createElement('span');
    ico.className = 'ico';
    ico.textContent = ICON[TYPES[node[2]]] || '•';
    row.appendChild(ico);

    var lab = document.createElement('span');
    lab.className = 'label';
    lab.innerHTML = hl(node[1] || '(无标题)', kw);
    row.appendChild(lab);

    var a = document.createElement('a');
    a.className = 'go';
    a.href = linkOf(i);
    a.target = '_blank';
    a.rel = 'noopener';
    a.textContent = '↗';
    a.title = '在飞书中打开';
    a.addEventListener('click', function (e) { e.stopPropagation(); });
    row.appendChild(a);

    var kids = null;
    if (hasChild) {
      kids = document.createElement('div');
      kids.className = 'kids';
      row._kids = kids;
      row._twist = tw;
      if (openSet[i]) { kids.className = 'kids open'; tw.className = 'twist open'; }
      // 点击行：展开/收起
      row.addEventListener('click', function () { toggle(i, kids, tw); });
    } else {
      row.addEventListener('click', function () { window.open(linkOf(i), '_blank', 'noopener'); });
    }
    return row;
  }

  function toggle(i, kids, tw) {
    if (kids.classList.contains('open')) {
      kids.classList.remove('open');
      tw.classList.remove('open');
      delete openSet[i];
    } else {
      if (!kids.childElementCount) renderInto(kids, children[i], '');
      kids.classList.add('open');
      tw.classList.add('open');
      openSet[i] = 1;
    }
  }

  function renderInto(container, list, kw) {
    var frag = document.createDocumentFragment();
    for (var k = 0; k < list.length; k++) {
      var row = makeRow(list[k], kw);
      frag.appendChild(row);
      if (row._kids) frag.appendChild(row._kids);
    }
    container.appendChild(frag);
  }

  // 构建路径（从根到该节点的标题链），供搜索结果定位
  function pathOf(i) {
    var parts = [], cur = N[i][3], guard = 0;
    while (cur !== -1 && guard++ < 20) {
      parts.unshift(N[cur][1]);
      cur = N[cur][3];
    }
    if (parts.length > 3) parts = ['…'].concat(parts.slice(-3));
    return parts.join(' / ');
  }

  var mode = 'tree';
  function renderTree() {
    mode = 'tree';
    panel.innerHTML = '';
    renderInto(panel, roots, '');
  }

  function renderSearch(kw) {
    mode = 'search';
    panel.innerHTML = '';
    var hits = [];
    var k = kw.toLowerCase();
    for (var i = 0; i < N.length; i++) {
      if ((N[i][1] || '').toLowerCase().indexOf(k) !== -1) hits.push(i);
    }
    if (!hits.length) {
      panel.innerHTML = '<div class="empty">没有匹配「' + esc(kw) + '」的条目</div>';
      return;
    }
    var shown = hits.slice(0, MAX_HITS);
    var frag = document.createDocumentFragment();
    for (var j = 0; j < shown.length; j++) {
      frag.appendChild(searchRow(shown[j], kw));
    }
    panel.appendChild(frag);
    if (hits.length > MAX_HITS) {
      var more = document.createElement('div');
      more.className = 'more';
      more.textContent = '仅显示前 ' + MAX_HITS + ' 条，共 ' + hits.length + ' 条匹配 —— 请补充关键词缩小范围。';
      panel.appendChild(more);
    }
  }

  function searchRow(i, kw) {
    var node = N[i];
    var row = document.createElement('div');
    row.className = 'row leaf-row';
    row.innerHTML =
      '<span class="twist leaf">▶</span>' +
      '<span class="ico">' + (ICON[TYPES[node[2]]] || '•') + '</span>' +
      '<span class="label">' + hl(node[1] || '(无标题)', kw) +
        '<span class="path">' + esc(pathOf(i)) + '</span></span>';
    var a = document.createElement('a');
    a.className = 'go';
    a.href = linkOf(i);
    a.target = '_blank';
    a.rel = 'noopener';
    a.textContent = '↗';
    a.title = '在飞书中打开';
    a.addEventListener('click', function (e) { e.stopPropagation(); });
    row.appendChild(a);
    row.addEventListener('click', function () { window.open(linkOf(i), '_blank', 'noopener'); });
    return row;
  }

  // 搜索输入（防抖）
  var timer = null;
  qEl.addEventListener('input', function () {
    var v = qEl.value.trim();
    searchWrap.classList.toggle('has-value', !!qEl.value);
    clearTimeout(timer);
    timer = setTimeout(function () {
      if (!v) renderTree();
      else renderSearch(v);
    }, 140);
  });
  document.getElementById('clear').addEventListener('click', function () {
    qEl.value = '';
    searchWrap.classList.remove('has-value');
    renderTree();
    qEl.focus();
  });
  document.getElementById('collapse').addEventListener('click', function () {
    openSet = Object.create(null);
    qEl.value = '';
    searchWrap.classList.remove('has-value');
    renderTree();
    window.scrollTo({ top: 0, behavior: 'smooth' });
  });

  // 主题
  var root = document.documentElement;
  var saved = localStorage.getItem('wt-theme');
  if (saved) root.setAttribute('data-theme', saved);
  else if (window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches)
    root.setAttribute('data-theme', 'dark');
  document.getElementById('theme').addEventListener('click', function () {
    var next = root.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
    root.setAttribute('data-theme', next);
    localStorage.setItem('wt-theme', next);
  });

  renderTree();
})();
</script>
</body>
</html>
